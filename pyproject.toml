[project]
name = "nix-tools-python"
version = "0.1.0"
description = "Python adapters and maintenance tooling for nix-tools"
requires-python = ">=3.14,<3.15"
dependencies = [
    "packaging>=25.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tyro>=1.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.10.0",
    "editorconfig>=0.17.1",
    "jinja2>=3.1.6",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.deptry]
known_first_party = ["terminal_env"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"

[tool.basedpyright]
typeCheckingMode = "all"
failOnWarnings = true
enableTypeIgnoreComments = false
pythonVersion = "3.14"
pythonPlatform = "All"
include = ["lib", "tests"]
# Fixtures contain deliberate syntax, import, and dependency errors.
exclude = ["tests/fixtures"]
extraPaths = ["lib", "lib/outdated"]
# Stubs for tools with separate Nix runtimes.
stubPath = "tests/typing_stubs"
