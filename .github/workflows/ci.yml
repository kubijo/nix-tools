name: CI

on:
  push:
    # Naming `tags` alone would stop matching branches entirely.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # A nixpkgs bump reformats every repo downstream; find out on a schedule, not mid-release.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  # One string for a branch push and its own pull request, so the pair collapses to one run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No fixture is gitignored
        run: |
          ignored=$(git ls-files --others --ignored --exclude-standard -- tests)
          if [ -n "$ignored" ]; then
            printf 'gitignored files under tests/:\n%s\n' "$ignored" >&2
            exit 1
          fi

  check:
    strategy:
      fail-fast: false
      # macOS is not optional here: the wrappers lean on coreutils flags GNU-only elsewhere.
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          # runCommandLocal checks otherwise refuse cached build results.
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - run: nix flake check -L --keep-going --no-update-lock-file
      - run: nix flake show --all-systems --no-update-lock-file

  # Determinate alone would leave upstream nix, which most consumers run, untested.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = false
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      # Reuse dependencies, but execute runCommandLocal checks under upstream Nix.
      - run: nix flake check -L --keep-going --no-update-lock-file --option always-allow-substitutes false

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - run: nix flake update
      - run: nix flake check -L --keep-going --no-update-lock-file
      # `flake check` skips systems it cannot build, so a dropped platform only shows here.
      - run: nix flake show --all-systems --no-update-lock-file
